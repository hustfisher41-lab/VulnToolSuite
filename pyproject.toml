[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-tool-suite"
version = "0.2.0"
description = "Evidence-first vulnerability data tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
charts = ["matplotlib>=3.8"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10"]
vision = ["sentence-transformers>=3.0", "Pillow>=10"]
test = ["pytest>=8"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
vulntools = "vulntools.cli:main"

[tool.setuptools.packages.find]
include = ["vulntools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
